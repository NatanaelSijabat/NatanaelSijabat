<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Technology radar</title><desc id="d">Technology choices arranged by operational maturity.</desc><defs><radialGradient id="r"><stop stop-color="#18202b"/><stop offset=".55" stop-color="#11161d"/><stop offset="1" stop-color="#0c0f13"/></radialGradient><style>.k{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px;fill:#747e8b}.v{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7dee8}.d{animation:o 3.5s ease-in-out infinite}@keyframes o{50%{opacity:.35}}</style></defs><rect width="1200" height="440" rx="12" fill="#0c0f13" stroke="#292f38"/><g transform="translate(310 220)"><circle r="172" fill="url(#r)" stroke="#262e38"/><circle r="116" fill="none" stroke="#35404d"/><circle r="60" fill="none" stroke="#4a596c"/><path d="M-172 0h344M0-172v344" stroke="#242b34"/><text x="-42" y="4" class="k">CORE</text><text x="65" y="-105" class="k">EXPANDING</text><text x="112" y="145" class="k">EXPLORING</text><g fill="#9fb1ce"><circle cx="-20" cy="-27" r="5" class="d"/><circle cx="22" cy="18" r="5" class="d" style="animation-delay:.4s"/><circle cx="-70" cy="59" r="5" class="d" style="animation-delay:.8s"/></g><g fill="#897f96"><circle cx="84" cy="-48" r="5" class="d"/><circle cx="-109" cy="-50" r="5" class="d" style="animation-delay:1.2s"/><circle cx="68" cy="129" r="5" class="d" style="animation-delay:1.6s"/></g></g><g transform="translate(574 70)"><text class="k">SIGNAL INDEX</text><text y="42" class="v">● Product interfaces</text><text y="74" class="v">● Service architecture</text><text y="106" class="v">● Data systems</text><text y="138" class="v">● Cloud operations</text><text y="190" class="v">● Applied AI</text><text y="222" class="v">● Automation</text><text y="254" class="v">● Orchestration</text></g><g transform="translate(930 70)"><text class="k">RULE</text><text y="42" class="v">Adopt