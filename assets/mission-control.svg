<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Mission control</title><desc id="d">Three current mission tracks with animated progress indicators.</desc>
  <defs><style>.k{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px;fill:#737d8a}.h{font:600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf1f6}.p{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8993a0}.n{font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#aab5c4}.bar{animation:load 4s ease-in-out infinite alternate;transform-origin:left}@keyframes load{from{transform:scaleX(.72)}to{transform:scaleX(1)}}</style></defs>
  <rect width="1200" height="340" rx="12" fill="#0c0f13" stroke="#292f38"/>
  <text x="48" y="52" class="k">ACTIVE WORKSTREAMS / 03</text><text x="1152" y="52" text-anchor="end" class="n">STATUS: BUILDING</text>
  <g transform="translate(48 86)"><rect width="344" height="206" rx="7" fill="#11151a" stroke="#2c333d"/><text x="24" y="34" class="k">01 · INTELLIGENCE</text><text x="24" y="80" class="h">AI that earns trust</text><text x="24" y="112" class="p">Evaluation · retrieval · agents</text><path d="M24 158H320" stroke="#252c34" stroke-width="4"/><path d="M24 158H248" stroke="#8398ba" stroke-width="4" class="bar"/><text x="24" y="184" class="n">PROVABLE USEFULNESS</text></g>
  <g transform="translate(428 86)"><rect width="344" height="206" rx="7" fill="#11151a" stroke="#2c333d"/><text x="24" y="34" class="k">02 · PRODUCT</text><text x="24" y="80" class="h">Software with leverage</text><text x="24" y="112" class="p">Education · markets · enterprise</text><path d="M24 158H320" stroke="#252c34" stroke-width="4"/><path d="M24 158H220" stroke="#8a8299" stroke-width="4" class="bar" style="animation-delay:.7s"/><text x="24" y="184" class="n">OPERATIONAL VALUE</text></g>
  <g transform="translate(808 86)"><rect width="344" height="206" rx="7" fill="#11151a" stroke="#2c333d"/><text x="24" y="34" class="k">03 · PLATFORM</text><text x="24" y="80" class="h">Calm infrastructure</text><text x="24" y="112" class="p">Cloud · containers · automation</text><path d="M24 158H320" stroke="#252c34" stroke-width="4"/><path d="M24 158H270" stroke="#72869f" stroke-width="4" class="bar" style="animation-delay:1.4s"/><text x="24" y="184" class="n">RELIABLE DELIVERY</text></g>
</svg>