<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d"><title id="t">Engineering principles</title><desc id="d">A continuous four-stage engineering loop.</desc><defs><style>.n{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#77818e}.h{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf2f7}.p{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8993a0}.orb{animation:q 3s ease-in-out infinite}@keyframes q{50%{r:10;opacity:.5}}</style></defs><rect width="1200" height="280" rx="12" fill="#0d1014" stroke="#292f38"/><path d="M116 124H1084" stroke="#353d48"/><path d="M1084 124l-12-7v14z" fill="#566171"/><g transform="translate(116 0)"><circle cy="124" r="7" fill="#94a8c8" class="orb"/><text x="-30" y="60" class="n">01</text><text x="-30" y="92" class="h">Clarify</text><text x="-30" y="175" class="p">Find the real constraint.</text></g><g transform="translate(400 0)"><circle cy="124" r="7" fill="#899aba" class="orb" style="animation-delay:.5s"/><text x="-30" y="60" class="n">02</text><text x="-30" y="92" class="h">Compose</text><text x="-30" y="175" class="p">Design coherent boundaries.</text></g><g transform="translate(684 0)"><circle cy="124" r="7" fill="#827d91" class="orb" style="animation-delay:1s"/><text x="-30" y="60" class="n">03</text><text x="-30" y="92" class="h">Observe</text><text x="-30" y="175" class="p">Make behavior visible.</text></g><g transform="translate(968 0)"><circle cy="124" r="7" fill="#777084" class="orb" style="animation-delay:1.5s"/><text x="-30" y="60" class="n">04</text><text x="-30" y="92" class="h">Evolve</text><text x="-30" y="175" class="p">Scale from evidence.</text></g><text x="116" y="235" class="n">FEEDBACK IS PART OF THE ARCHITECTURE</text></svg>