<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Natanael Sijabat — engineering systems with product intent</title>
  <desc id="desc">A dark minimal command surface with an animated system path and Natanael's roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d10"/><stop offset=".55" stop-color="#11151b"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#343b46"/><stop offset=".5" stop-color="#9aa9c4"/><stop offset="1" stop-color="#4b435f"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .eyebrow{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#8b949e}.name{font:600 64px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f7fb}.copy{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a8b0bc}.mono{font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#d3dae5}.dim{fill:#69717d}.pulse{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%{transform:translateX(-90px);opacity:0}15%,75%{opacity:.7}100%{transform:translateX(1020px);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <path d="M0 84H1200M0 436H1200" stroke="#242a32"/>
  <circle cx="48" cy="42" r="5" fill="#747d8c"/><circle cx="68" cy="42" r="5" fill="#454c56"/><circle cx="88" cy="42" r="5" fill="#303640"/>
  <text x="600" y="47" text-anchor="middle" class="eyebrow">ZIPPO / OPERATING SURFACE</text>
  <g transform="translate(68 126)">
    <text class="eyebrow" y="0">NATANAEL SIJABAT · SYSTEM 01</text>
    <text class="name" y="94">Engineering systems</text>
    <text class="name" y="166" fill="#c8d0dc">with product intent.</text>
    <text class="copy" y="220">Senior Full Stack Engineer · AI Engineer · Cloud Engineer · Product Architect</text>
  </g>
  <g transform="translate(68 390)">
    <circle cx="5" cy="-5" r="5" fill="#8ea4c7" class="pulse"/>
    <text x="20" class="mono">AVAILABLE FOR HIGH-LEVERAGE SYSTEMS</text>
  </g>
  <g transform="translate(824 124)">
    <rect width="308" height="232" rx="8" fill="#0d1117" stroke="#2b313a"/>
    <text x="22" y="34" class="eyebrow">LIVE DISCIPLINES</text>
    <g class="mono"><text x="22" y="78">01</text><text x="64" y="78">PRODUCT ENGINEERING</text><text x="273" y="78" class="dim">●</text><text x="22" y="116">02</text><text x="64" y="116">APPLIED INTELLIGENCE</text><text x="273" y="116" class="dim">●</text><text x="22" y="154">03</text><text x="64" y="154">CLOUD SYSTEMS</text><text x="273" y="154" class="dim">●</text><text x="22" y="192">04</text><text x="64" y="192">PRODUCT ARCHITECTURE</text><text x="273" y="192" class="dim">●</text></g>
    <path d="M22 212H286" stroke="#29313b"/><rect x="22" y="211" width="54" height="2" fill="url(#line)" class="scan"/>
  </g>
  <g transform="translate(68 471)"><path d="M0 0H1064" stroke="#262d36"/><path d="M0 0H520" stroke="url(#line)"/><circle cx="520" r="4" fill="#aebbd1" class="pulse"/></g>
  <text x="68" y="500" class="eyebrow">SCROLL / EXPLORE THE SYSTEM</text><text x="1132" y="500" text-anchor="end" class="eyebrow">01—08</text>
</svg>