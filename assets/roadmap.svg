<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Roadmap</title><desc id="d">A staged roadmap from foundations to open systems.</desc><defs><style>.k{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#727c89}.h{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8edf4}.p{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#87919e}.m{animation:m 5s ease-in-out infinite}@keyframes m{0%{transform:translateX(0)}50%{transform:translateX(908px)}100%{transform:translateX(0)}}</style></defs><rect width="1200" height="320" rx="12" fill="#0d1014" stroke="#292f38"/><path d="M124 158H1076" stroke="#353e49" stroke-width="2"/><circle cx="124" cy="158" r="7" fill="#92a5c3"/><circle cx="430" cy="158" r="7" fill="#8997ae"/><circle cx="736" cy="158" r="7" fill="#827b91"/><circle cx="1076" cy="158" r="7" fill="#716c7c"/><circle cx="124" cy="158" r="3" fill="#fff" class="m"/><g transform="translate(84 0)"><text y="62" class="k">NOW / 01</text><text y="96" class="h">Foundation</text><text y="210" class="p">Reliable product systems</text><text y="232" class="p">and observable delivery.</text></g><g transform="translate(390 0)"><text y="62" class="k">NEXT / 02</text><text y="96" class="h">Intelligence</text><text y="210" class="p">Evaluation-led AI</text><text y="232" class="p">inside real workflows.</text></g><g transform="translate(696 0)"><text y="62" class="k">THEN / 03</text><text y="96" class="h">Automation</text><text y="210" class="p">Durable agents with</text><text y="232" class="p">human control points.</text></g><g transform="translate(1036 0)"><text y="62" class="k">OPEN / 04</text><text y="96" class="h">Commons</text><text x="-100" y="210" class="p">Reusable infrastructure,</text><text x="-100" y="232" class="p">released with context.</text></g></svg>